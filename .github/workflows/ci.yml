name: CI

on:
  push:
    branches: [master]
  # 'synchronize' is what makes Gitar's follow-up commit re-run everything:
  # a new push to the PR head branch fires a brand-new analysis.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Publishes a check named "Build and Test".
  # Stays green before AND after Gitar's fix, which is the point: the pre-fix
  # pull request is blocked by SonarQube alone, not by a broken build.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  # Publishes a check named "SonarQube Quality Gate".
  # This is the check an administrator marks as required in branch protection.
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    steps:
      # Full history: SonarQube needs it to attribute lines to authors and to
      # compute "new code" correctly for pull request analysis.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SonarQube analysis data
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Fail early and legibly instead of producing a confusing scanner error.
      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          missing=0
          for name in SONAR_TOKEN SONAR_HOST_URL SONAR_PROJECT_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See DEMO.md, 'Repository configuration'."
              missing=1
            fi
          done
          exit "$missing"

      # 'verify' produces the JaCoCo XML report that Sonar reads for coverage
      # on new code; 'sonar' then analyses the compiled classes.
      # -Dsonar.qualitygate.wait=true blocks until SonarQube has computed the
      # gate for THIS analysis and fails the job when the gate is red, which is
      # what turns the quality gate into a real blocking GitHub check.
      #
      # Pull request context (key, branch, base) is auto-detected from the
      # GitHub Actions environment by the scanner.
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: >-
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
